name: Auto Release Docs

on:
  schedule:
    # 每 4 小时轮询；只要当前提交有变化就发一次带提交 hash 的新 release（不再限制每天一次）
    - cron: '0 */4 * * *'
  workflow_dispatch: # 手动构建（同一天可多次发布，按提交 hash 去重）
    inputs:
      force:
        description: 'Force publish even if this commit already has a release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-release-docs
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 不再以 CTNH-Modules 有无新提交作为闸门：release 与当前提交绑定，
      # 由 check_release.py 按 tag 是否已存在去重（同一天可发多次，同一提交只发一次）。
      - name: Build skill package and check release status
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force }}
        run: |
          python scripts/check_release.py
          echo "Decision:"
          cat "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.release_tag }}
          name: ${{ steps.check.outputs.release_title }}
          body: ${{ steps.check.outputs.release_body }}
          files: ${{ steps.check.outputs.asset_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
