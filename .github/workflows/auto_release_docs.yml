name: Auto Release Docs

on:
  schedule:
    # 轮询检测：check_release.py 内部判断"同一天已发布则跳过"，无新发布时不创建 release
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手动构建
    inputs:
      force:
        description: 'Force release even if today is already released'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-release-docs
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check pending updates
        id: pending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_pending.py

      - name: Build skill package and check release status
        if: steps.pending.outputs.has_updates == 'true'
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force }}
        run: |
          python scripts/check_release.py
          echo "Decision:"
          cat "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.release_tag }}
          name: ${{ steps.check.outputs.release_title }}
          body: ${{ steps.check.outputs.release_body }}
          files: ${{ steps.check.outputs.asset_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
