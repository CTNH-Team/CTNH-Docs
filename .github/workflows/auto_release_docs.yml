name: Auto Release Docs

on:
  schedule:
    # 每 4 小时轮询；auto-doc-update 分支 head 前进就发一次（不再限制每天一次）
    - cron: '0 */4 * * *'
  workflow_dispatch: # 手动构建（同一天可多次发布，按同步分支提交 hash 去重）
    inputs:
      force:
        description: 'Force publish even if the sync-branch commit already has a release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: auto-release-docs
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 工作树留在默认分支：跑的是本分支的 scripts/；发布内容另行从同步分支取（见下）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 发布源：同步分支 auto-doc-update 的 head（同步 PR 未合并时也要能发）；
      # 该分支不存在时回落到默认分支 head。这里只解析 sha，**不切换工作树**——
      # 工作树必须留在默认分支，否则 workflow 自己的 scripts/ 会变成该分支上的旧版本。
      # 打包由 check_release.py 用 `git archive <sha> ctnh-docs` 从该 ref 取内容，tag 与内容同源。
      - name: Resolve release source
        id: source
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin auto-doc-update >/dev/null 2>&1; then
            ref=auto-doc-update
          else
            ref="${{ github.event.repository.default_branch }}"
          fi
          git fetch --no-tags --quiet origin "$ref"
          sha=$(git rev-parse "origin/$ref")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release source: origin/$ref @ ${sha:0:8}"

      - name: Build skill package and check release status
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_REF: ${{ steps.source.outputs.ref }}
        run: |
          python scripts/check_release.py
          echo "Decision:"
          cat "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.release_tag }}
          name: ${{ steps.check.outputs.release_title }}
          body: ${{ steps.check.outputs.release_body }}
          files: ${{ steps.check.outputs.asset_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
