name: Auto Sync Docs

on:
  schedule:
    # 轮询检测 CTNH-Modules 主仓库与子模块的新提交；无变化时秒退（见 check_pending 步骤）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手动触发
    inputs:
      force_latest:
        description: 'Force sync with the latest commit'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run: run agent + gate, but do not advance state or open a PR'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-sync-docs
  cancel-in-progress: false

# 注意：工作流级 env 只允许 github/secrets/inputs/vars 上下文。
# DSH_HOME 依赖 runner.temp，因此只能放在 step 级 env（见 dsh 的两个步骤）。
env:
  # 任何非空值都会关闭 OTel 上报（基座行按该变量禁用遥测）
  DSH_TELEMETRY_DISABLED: '1'
  # both = 原生工具 schema + run_code(PTC) 同时可见；ptc = 只暴露 run_code
  DSH_TOOLS_MODE: ${{ vars.DSH_TOOLS_MODE || 'both' }}
  DSH_MODEL: ${{ vars.DSH_MODEL || 'deepseek-flash' }}
  DSH_VERSION: ${{ vars.DSH_VERSION || '0.1.5-rc.2' }}
  MODULES_ROOT: workspace/modules-src/modules

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    # agent 一轮要读基线 + 扫源码 + 写文档；超时直接失败，绝不推进水位
    timeout-minutes: 60
    steps:
      - name: Checkout CTNH-Docs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 按 requirements.txt 的哈希缓存 ~/.cache/pip
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check pending updates
        id: pending
        env:
          # 读公开仓库 API 足够；GITHUB_TOKEN 提高限速（5000/h），无需任何 PAT
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_LATEST: ${{ inputs.force_latest }}
          # 已有未合并的同步 PR 时跳过本轮，避免同一批提交重复生成/重复开 PR
          SKIP_IF_OPEN_PR: 'true'
        run: python scripts/check_pending.py

      - name: Checkout CTNH-Modules
        if: steps.pending.outputs.has_updates == 'true'
        uses: actions/checkout@v4
        with:
          repository: CTNH-Team/CTNH-Modules
          ref: master
          path: workspace/modules-src
          fetch-depth: 50

      - name: Checkout submodules from their branches
        if: steps.pending.outputs.has_updates == 'true'
        run: |
          # 主仓库 master 记录的 modules/CTPP 与 modules/GregTech-Modern 指针指向
          # 子模块仓库中已不存在（force-push 后被 GC）的提交，actions/checkout 递归
          # 拉取子模块会直接失败。因此不依赖主仓库的 gitlink 指针，改为从各子模块
          # 仓库的分支最新直接克隆源码，与 monitor.py 轮询的分支保持一致。
          cd workspace/modules-src
          mkdir -p modules
          for m in CTNH-Core CTNH-Lib CTNH-Bio CTNH-Energy CTNH-Mana CTNH-Astral CTPP Create-Enough-Items; do
            echo "== cloning $m (dev) =="
            rm -rf "modules/$m"  # 清掉 checkout 留下的空 gitlink 目录
            git clone --depth=50 --branch dev "https://github.com/CTNH-Team/$m.git" "modules/$m"
          done
          # GregTech-Modern 是 vendored 依赖，不参与文档扫描，但保持源码树完整。
          # 注意：其远程默认分支是 ctnh（.gitmodules 中声明的 dev 已过时）。
          echo "== cloning GregTech-Modern (ctnh) =="
          rm -rf modules/GregTech-Modern
          git clone --depth=50 --branch ctnh "https://github.com/CTNH-Team/GregTech-Modern.git" modules/GregTech-Modern

      - name: Build sync plan
        if: steps.pending.outputs.has_updates == 'true'
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_LATEST: ${{ inputs.force_latest }}
        run: python scripts/prepare_sync.py

      - name: Set up Node
        if: steps.plan.outputs.has_modules == 'true'
        uses: actions/setup-node@v4
        with:
          # PTC 运行时使用 node:module 的类型剥离能力，官方 CI 亦使用 Node 24
          node-version: '24'

      - name: Cache dsh package
        if: steps.plan.outputs.has_modules == 'true'
        uses: actions/cache@v4
        with:
          # 缓存 npm 的 tarball 仓库（_cacache）而不是解压后的 ~/.npm/_npx：
          # _npx 目录名是 npx 自己算的哈希，跨 npx 版本可能变化；_cacache 更稳。
          # 命中时 npx 直接从缓存解压，省掉 ~246 MB 的下载。
          path: ~/.npm/_cacache
          key: dsh-npm-${{ runner.os }}-${{ env.DSH_VERSION }}-v1
          restore-keys: |
            dsh-npm-${{ runner.os }}-${{ env.DSH_VERSION }}-
            dsh-npm-${{ runner.os }}-

      - name: Preflight dsh
        if: steps.plan.outputs.has_modules == 'true'
        env:
          # 密钥与 DSH_HOME 只在需要的步骤出现，绝不放到工作流级
          DSH_HOME: ${{ runner.temp }}/dsh-home
          # 端点直接用 step 级 env，不经 $GITHUB_ENV 中转：
          # $GITHUB_ENV 只对「后续步骤」生效，中转会让本步的探针校验到与 agent 不同的端点。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.LLM_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || secrets.BASE_URL }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error::缺少 DEEPSEEK_API_KEY（或 LLM_API_KEY），dsh headless 无法运行"
            exit 1
          fi
          echo "DEEPSEEK_API_KEY present."
          # 0) 连通性：先确认 runner 能到达端点。否则 dsh 只会抛出
          #    "TRANSPORT: DeepSeek API request to <url> failed"，看不到真正原因。
          base="${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
          # 端点可能来自 secret。GitHub 的日志遮蔽只做「精确匹配整串」，任何从它派生出的
          # 子串（如主机名）都不会被自动遮蔽；而 ::add-mask:: 那一行本身会把值写进日志
          # （actions/runner#475，长期未修复）。因此既不复述端点、也不依赖平台遮蔽，
          # 改为在打印任何可能含端点的文本前先本地脱敏。
          host=""
          if [ -n "${DEEPSEEK_BASE_URL:-}" ]; then
            host="${DEEPSEEK_BASE_URL#*://}"
            host="${host%%/*}"
            echo "using custom DEEPSEEK_BASE_URL (value redacted)."
          else
            echo "using default endpoint."
          fi
          redact() {
            local text; text="$(cat)"
            if [ -n "${DEEPSEEK_BASE_URL:-}" ]; then text="${text//"$DEEPSEEK_BASE_URL"/***}"; fi
            if [ -n "$host" ]; then text="${text//"$host"/***}"; fi
            printf '%s\n' "$text"
          }
          set +e
          http=$(curl -sS -o "$RUNNER_TEMP/relay-body.txt" -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" -H 'Content-Type: application/json' \
            -X POST "$base/chat/completions" \
            -d "{\"model\":\"$DSH_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" \
            2> "$RUNNER_TEMP/relay-curl-err.txt")
          curl_code=$?
          set -e
          if [ "$curl_code" -ne 0 ]; then
            echo "::error::runner 无法连接到端点（curl exit $curl_code），属网络层失败"
            redact < "$RUNNER_TEMP/relay-curl-err.txt" || true
            exit 1
          fi
          echo "endpoint HTTP $http"
          case "$http" in
            2*)
              echo "endpoint reachable." ;;
            401|403)
              echo "::error::端点拒绝凭据（HTTP $http）——检查 key 是否匹配该中转"
              head -c 500 "$RUNNER_TEMP/relay-body.txt" | redact || true
              exit 1 ;;
            404)
              echo "::error::端点路径不存在（HTTP 404）——检查 DEEPSEEK_BASE_URL 是否正确（例如是否缺少 /v1）"
              head -c 300 "$RUNNER_TEMP/relay-body.txt" | redact || true
              exit 1 ;;
            *)
              echo "::warning::端点返回 HTTP $http，仍继续尝试（可能是限流或临时故障）"
              head -c 300 "$RUNNER_TEMP/relay-body.txt" | redact || true ;;
          esac
          # 1) 组合校验：profile 首次使用会自动初始化；overlay 非法会在这里直接失败
          npx --yes @deepseek-ai/dsh@"$DSH_VERSION" --profile headless \
            --patch prompts/headless.ci.patch.yml --dump-config > /dev/null
          echo "profile composition OK (dsh $DSH_VERSION, tools=$DSH_TOOLS_MODE)."
          # 2) 装配校验：--dump-config 只打印组合树、不加载插件，因此插件装配期错误
          #    （例如权限预设与沙箱/审批组合不匹配）只有真正 boot 才会暴露。
          #    这里用一次性探针 key 跑一次短任务：boot 成功后会以鉴权失败告终，所以只对
          #    "插件树装配失败"硬失败，其余输出仅打印，避免把网关的鉴权文案当成判据。
          set +e
          probe=$(DEEPSEEK_API_KEY="dsh-preflight-probe" timeout 180 \
            npx --yes @deepseek-ai/dsh@"$DSH_VERSION" --profile headless \
            --patch prompts/headless.ci.patch.yml "preflight probe" 2>&1 | tail -n 20)
          set -e
          if printf '%s' "$probe" | grep -qE "plugin tree failed to load|failed to apply loader entry"; then
            echo "::error::dsh 插件树装配失败，组合非法（详见下方输出）"
            printf '%s\n' "$probe" | redact
            exit 1
          fi
          # 探针用假 key，鉴权失败是预期结果，因此成功路径不打印探针输出，
          # 免得 "AUTH: ..." 被误读成故障；只有装配失败时才打印以便定位。
          echo "plugin tree loaded (probe key auth failure is expected)."

      - name: Run docs sync agent
        if: steps.plan.outputs.has_modules == 'true'
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.LLM_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL || secrets.BASE_URL }}
        run: |
          # 日志可能带上端点 URL，先备好本地脱敏（GitHub 只遮蔽完整 secret 串，不含派生子串）
          host=""
          if [ -n "${DEEPSEEK_BASE_URL:-}" ]; then
            host="${DEEPSEEK_BASE_URL#*://}"
            host="${host%%/*}"
          fi
          redact() {
            local text; text="$(cat)"
            if [ -n "${DEEPSEEK_BASE_URL:-}" ]; then text="${text//"$DEEPSEEK_BASE_URL"/***}"; fi
            if [ -n "$host" ]; then text="${text//"$host"/***}"; fi
            printf '%s\n' "$text"
          }
          TASK="$(cat prompts/headless_task.md)"
          set +e
          timeout 2700 npx --yes @deepseek-ai/dsh@"$DSH_VERSION" --profile headless \
            --patch prompts/headless.ci.patch.yml "$TASK" \
            > "$RUNNER_TEMP/dsh-stdout.log" 2> "$RUNNER_TEMP/dsh-stderr.log"
          code=$?
          set -e
          echo "--- agent stdout (tail) ---"
          tail -n 60 "$RUNNER_TEMP/dsh-stdout.log" | redact || true
          echo "--- agent stderr (tail) ---"
          tail -n 40 "$RUNNER_TEMP/dsh-stderr.log" | redact || true
          echo "agent exit code: $code"
          exit $code

      - name: Verify docs
        if: steps.plan.outputs.has_modules == 'true'
        run: python scripts/verify_docs.py
      - name: Ensure base branch is current
        # 放在推进水位之前：无法产出 PR 的轮次不应该动 state
        if: steps.pending.outputs.has_updates == 'true' && inputs.dry_run != true
        env:
          BASE_REF: ${{ github.ref_name }}
        run: |
          # create-pull-request 以「当前分支」为工作基点，不会 rebase：它把改动提交在本地
          # HEAD 之上，再建 PR 分支。因此运行期间基点一旦前进，分支树就等于把那段期间的
          # 提交整体回退（PR diff 会显示成撤销别人的改动）。若被回退的文件里有 workflow，
          # GitHub 还会以「App 缺少 workflows 权限」拒绝推送——那道拒绝其实是在保护仓库。
          # 这里主动检出该情形并明确失败：本轮放弃，等下一轮以最新基点重跑。
          git fetch --no-tags --quiet origin "$BASE_REF"
          local_sha=$(git rev-parse HEAD)
          remote_sha=$(git rev-parse "origin/$BASE_REF")
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "::error::基点 $BASE_REF 已前进：本轮基点 ${local_sha:0:8}，远端 ${remote_sha:0:8}。本轮放弃（不推进水位、不开 PR），等待下次轮询以最新基点重跑。"
            echo "期间新增的提交："
            git log --oneline "$local_sha..$remote_sha" | head -n 10 || true
            exit 1
          fi
          echo "base $BASE_REF is current at ${local_sha:0:8}."

      - name: Advance sync state
        id: round
        # 只检测到主仓库变更时也要推进水位，否则同一批提交会被反复轮询到
        if: steps.pending.outputs.has_updates == 'true' && inputs.dry_run != true
        run: python scripts/advance_state.py

      - name: Upload agent artifacts
        if: always() && steps.pending.outputs.has_updates == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-sync-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/dsh-stdout.log
            ${{ runner.temp }}/dsh-stderr.log
            ${{ runner.temp }}/dsh-home/sessions/**
            workspace/sync-plan.json

      - name: Create Pull Request
        # 无改动时 create-pull-request 自身会跳过，不会产生空 PR
        if: steps.pending.outputs.has_updates == 'true' && inputs.dry_run != true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 固定分支名：peter-evans/create-pull-request 会更新已有同名 PR，
          # 配合 SKIP_IF_OPEN_PR 保证同一批提交只产生一个 PR，不堆积重复 PR。
          branch: auto-doc-update
          title: ${{ steps.round.outputs.pr_title }}
          body: ${{ steps.round.outputs.pr_body }}
          labels: auto-generated
          commit-message: "docs: automated sync from CTNH-Modules"
          base: ${{ github.ref_name }} # 确保指向当前运行的分支
          # 只提交文档与水位；agent 的临时产物、workspace/ 检出漂移都不进 PR
          add-paths: |
            ctnh-docs/references/**
            scripts/state.json
