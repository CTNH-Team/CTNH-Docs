name: Auto Sync Docs

on:
  schedule:
    # 轮询检测 CTNH-Modules 主仓库与子模块的新提交；无变化时秒退（见 check_pending 步骤）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手动触发
    inputs:
      force_latest:
        description: 'Force sync with the latest commit'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-sync-docs
  cancel-in-progress: false

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CTNH-Docs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check pending updates
        id: pending
        env:
          # 读公开仓库 API 足够；GITHUB_TOKEN 提高限速（5000/h），无需任何 PAT
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_LATEST: ${{ inputs.force_latest }}
          # 已有未合并的同步 PR 时跳过本轮，避免同一批提交重复生成/重复开 PR
          SKIP_IF_OPEN_PR: 'true'
        run: python scripts/check_pending.py

      - name: Checkout CTNH-Modules
        if: steps.pending.outputs.has_updates == 'true'
        uses: actions/checkout@v4
        with:
          repository: CTNH-Team/CTNH-Modules
          ref: master
          path: workspace/modules-src
          fetch-depth: 50

      - name: Checkout submodules from their branches
        if: steps.pending.outputs.has_updates == 'true'
        run: |
          # 主仓库 master 记录的 modules/CTPP 与 modules/GregTech-Modern 指针指向
          # 子模块仓库中已不存在（force-push 后被 GC）的提交，actions/checkout 递归
          # 拉取子模块会直接失败。因此不依赖主仓库的 gitlink 指针，改为从各子模块
          # 仓库的分支最新直接克隆源码，与 monitor.py 轮询的分支保持一致。
          cd workspace/modules-src
          mkdir -p modules
          for m in CTNH-Core CTNH-Lib CTNH-Bio CTNH-Energy CTNH-Mana CTNH-Astral CTPP Create-Enough-Items; do
            echo "== cloning $m (dev) =="
            rm -rf "modules/$m"  # 清掉 checkout 留下的空 gitlink 目录
            git clone --depth=50 --branch dev "https://github.com/CTNH-Team/$m.git" "modules/$m"
          done
          # GregTech-Modern 是 vendored 依赖，不参与 LLM 扫描，但保持源码树完整。
          # 注意：其远程默认分支是 ctnh（.gitmodules 中声明的 dev 已过时）。
          echo "== cloning GregTech-Modern (ctnh) =="
          rm -rf modules/GregTech-Modern
          git clone --depth=50 --branch ctnh "https://github.com/CTNH-Team/GregTech-Modern.git" modules/GregTech-Modern

      - name: Debug Environment Variables
        if: steps.pending.outputs.has_updates == 'true'
        run: |
          echo "Checking environment variables (presence only):"
          [ -n "$GITHUB_TOKEN" ] && echo "GITHUB_TOKEN is set" || echo "GITHUB_TOKEN is NOT set"
          [ -n "$LLM_API_KEY" ] && echo "LLM_API_KEY is set" || echo "LLM_API_KEY is NOT set"
          [ -n "$BASE_URL" ] && echo "BASE_URL is set" || echo "BASE_URL is NOT set"
          [ -n "$MODEL_NAME" ] && echo "MODEL_NAME is set" || echo "MODEL_NAME is NOT set"

      - name: Run sync script
        if: steps.pending.outputs.has_updates == 'true'
        id: sync_script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # LLM 凭据：任选一种风格。OpenAI 兼容: LLM_API_KEY + OPENAI_API_BASE + MODEL_NAME;
          # Gemini 原生: LLM_API_KEY + (可选 BASE_URL=https://generativelanguage.googleapis.com)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION || 'v1beta' }}
          LLM_API_STYLE: ${{ vars.LLM_API_STYLE || 'auto' }}
          SYNC_LOOKBACK_HOURS: ${{ vars.SYNC_LOOKBACK_HOURS || '24' }}
          MODULES_ROOT: workspace/modules-src/modules
        run: |
          if [ "${{ inputs.force_latest }}" = "true" ]; then
            python scripts/main.py --force-latest
          else
            python scripts/main.py
          fi

      - name: Set branch name
        if: steps.sync_script.outputs.has_updates == 'true'
        id: vars
        # 固定分支名：peter-evans/create-pull-request 会更新已有同名 PR，
        # 配合 SKIP_IF_OPEN_PR 保证同一批提交只产生一个 PR，不堆积重复 PR。
        run: echo "branch=auto-doc-update" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.sync_script.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.vars.outputs.branch }}
          title: ${{ steps.sync_script.outputs.pr_title }}
          body: ${{ steps.sync_script.outputs.pr_body }}
          labels: auto-generated
          commit-message: "docs: automated sync from CTNH-Modules"
          base: ${{ github.ref_name }} # 确保指向当前运行的分支
