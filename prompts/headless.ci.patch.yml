# CTNH-Docs CI overlay：叠加在 headless profile 之上（--patch 层最后应用）。
# 配置 CI 的模型网关与工具执行器，沙箱和审批沿用 headless 默认值。
#
# 注意（踩过的坑）：不要单独覆盖 id: approval 的 policy。
# 权限预设要求「沙箱模式 + 审批策略」的组合命中 presets 表中的一项，否则
# dsh-permission-presets 直接在装配阶段抛
# "composed sandbox and approval defaults match no preset"。
# 而 headless 也用不着覆盖：base 默认就是 workspace-write 预设
# （sandbox=workspace-write、approval=ask），工作区内的写入由沙箱直接放行、
# 不经过审批；只有越界写入才会请求升权，届时在无人值守下按拒绝关闭——正是我们要的行为。

- id: agent-default-model
  config:
    provider: ci-gateway
    model: !!js process.env.DSH_MODEL || 'deepseek-flash'
    reasoningEffort: !!js process.env.DSH_REASONING_EFFORT || undefined

# 工具呈现模式。0.1.x 用 tools.config.mode（both/ptc）+ maxParallelSubCalls 表达；
# 0.2.x 把这两个字段改成了 z.never()（写进 overlay 会直接
# "ValidationError: $.mode expected nullable but got both"），改为挂载两个 executor：
# tool-executor-native（原生工具 schema）与 tool-executor-ptc（只暴露 run_code）。
# 两者互斥——同一作用域只允许注册一个（"Only one tool executor may be registered
# in each scope"），因此 0.2.x 没有 both 模式，必须二选一。
# DSH_TOOLS_MODE=ptc 选 PTC；其余取值保持 headless 默认（原生工具 schema）。
# 0.1.x 没有这两个 id，--patch 只会打印 'entry ... not found' 并继续，所以同一份
# overlay 同时兼容两个大版本（代价是老版本拿不到 both，只剩 base 默认呈现）。
- id: tool-executor-native
  disabled: !!js process.env.DSH_TOOLS_MODE === 'ptc'

- id: tool-executor-ptc
  disabled: !!js process.env.DSH_TOOLS_MODE !== 'ptc'

# DSH 0.2.2 的官方适配器使用 Messages。CI 中转允许 Chat Completions。
- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      ci-gateway:
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: !!js (process.env.DEEPSEEK_BASE_URL || 'https://api.deepseek.com').replace(/\/+$/, '')
        compat:
          maxTokensField: max_tokens
          supportsDeveloperRole: false
          supportsStore: false
          thinkingFormat: deepseek
        models:
          - id: !!js process.env.DSH_MODEL || 'deepseek-flash'
            reasoningEfforts:
              'off':
              high: high
              max: max
        # 保留中转偶发断流或限流时的重试策略。
        retryPolicy:
          mode: normal
          maxRetries: 10
          retryableCodes:
            - STREAM_CLOSED
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
          backoff:
            initialDelayMs: 1000
            maxDelayMs: 30000
            jitterRatio: 0.2
